name: 🐍 Generate Snake Animation

# Generates the contribution-graph snake and pushes the SVGs to the "output" branch.
# The README embeds those SVGs from the output branch.

on:
  # Re-generate automatically twice a day so the snake stays current
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual runs from the Actions tab (use this for the FIRST run)
  workflow_dispatch:
  # Re-generate on every push to main
  push:
    branches:
      - main

# Required so the github-actions bot can push to the output branch (prevents 403 errors)
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Generate a light SVG and a dark SVG from the contribution graph
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Push the generated files to a branch named "output"
      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
